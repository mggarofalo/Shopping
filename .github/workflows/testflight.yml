name: Upload to TestFlight
run-name: TestFlight ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      audience:
        description: Existing Michael and Beka groups, or an explicitly private internal release
        required: true
        default: all_testers
        type: choice
        options:
          - all_testers
          - internal_only
      build_number:
        description: Positive build number; leave blank to select the next unused number
        required: false
        type: string
      marketing_version:
        description: Optional marketing version for preflight or verify-only (defaults to source version)
        required: false
        type: string
      confirm_upload:
        description: Archive, validate, and upload this commit to TestFlight
        required: true
        default: false
        type: boolean
      verify_only:
        description: Verify and distribute an existing version/build without uploading again
        required: true
        default: false
        type: boolean
      preflight_only:
        description: Read-only App Store Connect inventory and unused build-number check
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: shopping-testflight
  cancel-in-progress: false
jobs:
  intent:
    name: Validate release intent
    runs-on: ubuntu-latest
    steps:
      - name: Require main and exactly one mode
        env:
          REF: ${{ github.ref }}
          UPLOAD: ${{ inputs.confirm_upload }}
          VERIFY: ${{ inputs.verify_only }}
          PREFLIGHT: ${{ inputs.preflight_only }}
          BUILD: ${{ inputs.build_number }}
          AUDIENCE: ${{ inputs.audience }}
        run: |
          [[ "$REF" == refs/heads/main ]] || { echo 'Release modes require main.' >&2; exit 1; }
          [[ "$AUDIENCE" == all_testers || "$AUDIENCE" == internal_only ]] || { echo 'Select a supported tester audience.' >&2; exit 1; }
          modes=0
          for mode in "$UPLOAD" "$VERIFY" "$PREFLIGHT"; do
            if [[ "$mode" == true ]]; then modes=$((modes + 1)); fi
          done
          [[ "$modes" -eq 1 ]] || { echo 'Select exactly one release mode.' >&2; exit 1; }
          if [[ "$VERIFY" == true && ! "$BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Verify-only requires an explicit positive build number.' >&2; exit 1
          fi
  preflight:
    name: Read-only preflight
    needs: intent
    if: ${{ inputs.preflight_only && !inputs.confirm_upload && !inputs.verify_only && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 20
    environment: testflight
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check clean exact source
        run: .github/scripts/validate-release-source.sh
      - name: Inspect build inventory and approved audience (GET only)
        id: preflight
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: ruby .github/scripts/preflight-testflight.rb
      - name: Verify existing external audience and review metadata (GET only)
        if: ${{ inputs.audience == 'all_testers' }}
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          MARKETING_VERSION: ${{ steps.preflight.outputs.marketing_version }}
        run: ruby .github/scripts/external-testflight.rb --preflight
  upload:
    name: Archive & Upload
    needs: intent
    if: ${{ inputs.confirm_upload && !inputs.verify_only && !inputs.preflight_only && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 45
    environment: testflight
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check clean exact source and required CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/validate-release-source.sh
          python3 .github/scripts/require-release-ci.py
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Choose unused build number (GET only)
        id: preflight
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          RELEASE_MODE: upload
        run: ruby .github/scripts/preflight-testflight.rb
      - name: Verify existing external audience and review metadata (GET only)
        if: ${{ inputs.audience == 'all_testers' }}
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          MARKETING_VERSION: ${{ steps.preflight.outputs.marketing_version }}
        run: ruby .github/scripts/external-testflight.rb --preflight
      - name: Archive, validate, and upload
        id: upload
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
          GH_TOKEN: ${{ github.token }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_WATCH_PROVISIONING_PROFILE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          BUILD_NUMBER: ${{ steps.preflight.outputs.build_number }}
          MARKETING_VERSION: ${{ steps.preflight.outputs.marketing_version }}
        run: .github/scripts/upload-testflight.sh
      - name: Confirm processing and tester distribution
        id: internal
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          BUILD_NUMBER: ${{ steps.preflight.outputs.build_number }}
          MARKETING_VERSION: ${{ steps.preflight.outputs.marketing_version }}
          DISTRIBUTE_FROM_BUILD: '6'
        run: ruby .github/scripts/distribute-testflight.rb
      - name: Submit external beta review and assign existing Beka group
        id: external
        if: ${{ inputs.audience == 'all_testers' }}
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          BUILD_NUMBER: ${{ steps.preflight.outputs.build_number }}
          MARKETING_VERSION: ${{ steps.preflight.outputs.marketing_version }}
        run: ruby .github/scripts/external-testflight.rb
      - name: Report release outcomes
        if: ${{ always() }}
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
          RELEASE_MODE: upload
          RELEASE_VERSION: ${{ steps.preflight.outputs.marketing_version }}
          RELEASE_BUILD: ${{ steps.preflight.outputs.build_number }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          INTERNAL_OUTCOME: ${{ steps.internal.outcome }}
          EXTERNAL_OUTCOME: ${{ steps.external.outcome }}
          EXTERNAL_AVAILABLE: ${{ steps.external.outputs.external_available }}
        run: python3 .github/scripts/release-evidence.py finalize
      - name: Retain release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-evidence-upload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence/
          retention-days: 14
          if-no-files-found: warn

  verify:
    name: Verify existing build
    needs: intent
    if: ${{ inputs.verify_only && !inputs.confirm_upload && !inputs.preflight_only && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 20
    environment: testflight
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check clean exact source
        run: .github/scripts/validate-release-source.sh
      - name: Confirm processing and tester distribution
        id: internal
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          DISTRIBUTE_FROM_BUILD: '6'
        run: ruby .github/scripts/distribute-testflight.rb
      - name: Submit external beta review and assign existing Beka group
        id: external
        if: ${{ inputs.audience == 'all_testers' }}
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: ruby .github/scripts/external-testflight.rb
      - name: Report release outcomes
        if: ${{ always() }}
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
          RELEASE_MODE: verify
          RELEASE_VERSION: ${{ steps.internal.outputs.marketing_version || inputs.marketing_version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
          UPLOAD_OUTCOME: skipped
          INTERNAL_OUTCOME: ${{ steps.internal.outcome }}
          EXTERNAL_OUTCOME: ${{ steps.external.outcome }}
          EXTERNAL_AVAILABLE: ${{ steps.external.outputs.external_available }}
        run: python3 .github/scripts/release-evidence.py finalize
      - name: Retain release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-evidence-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence/
          retention-days: 14
          if-no-files-found: warn
