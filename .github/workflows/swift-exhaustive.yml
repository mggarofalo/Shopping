name: Swift exhaustive tests

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: full
        type: choice
        options:
          - full
          - performance
  push:
    branches:
      - "milestone/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'full' }}
  cancel-in-progress: true

jobs:
  exhaustive:
    name: Full UI or performance suite
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEST_PLAN: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'performance' && 'ShoppingPerformance' || 'ShoppingFull' }}

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Start pinned iOS simulator
        id: simulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          shopping_simulator_id="$(xcrun simctl create \
            'Shopping exhaustive iPhone 16 Pro' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          xcrun simctl boot "$shopping_simulator_id"
          xcrun simctl bootstatus "$shopping_simulator_id" -b
          echo "udid=$shopping_simulator_id" >> "$GITHUB_OUTPUT"

      - name: Build exhaustive test products
        run: |
          set -uo pipefail
          started_at="$(date +%s)"
          set +e
          xcodebuild build-for-testing \
            -project Shopping.xcodeproj \
            -scheme Shopping \
            -testPlan "$TEST_PLAN" \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath DerivedData \
            -quiet 2>&1 | tee ExhaustiveBuild.log
          exit_code="${PIPESTATUS[0]}"
          set -e
          finished_at="$(date +%s)"
          echo "$((finished_at - started_at))" > ExhaustiveBuildSeconds.txt
          exit "$exit_code"

      - name: Run exhaustive tests
        run: |
          set -uo pipefail
          started_at="$(date +%s)"
          set +e
          xcodebuild test-without-building \
            -project Shopping.xcodeproj \
            -scheme Shopping \
            -testPlan "$TEST_PLAN" \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath DerivedData \
            -resultBundlePath ExhaustiveResults.xcresult \
            -quiet 2>&1 | tee ExhaustiveTest.log
          exit_code="${PIPESTATUS[0]}"
          set -e
          finished_at="$(date +%s)"
          echo "$((finished_at - started_at))" > ExhaustiveTestSeconds.txt
          exit "$exit_code"

      - name: Publish exhaustive test summary
        if: always()
        run: |
          .github/scripts/summarize-xcresult.sh \
            "$TEST_PLAN" \
            ExhaustiveResults.xcresult \
            ExhaustiveBuild.log \
            ExhaustiveTest.log \
            ExhaustiveSummary.md \
            ExhaustiveSummary.json \
            ExhaustiveBuildSeconds.txt \
            ExhaustiveTestSeconds.txt
          cat ExhaustiveSummary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exhaustive summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exhaustive-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ExhaustiveSummary.md
            ExhaustiveSummary.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload exhaustive failure results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: exhaustive-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ExhaustiveResults.xcresult
            ExhaustiveBuild.log
            ExhaustiveTest.log
          if-no-files-found: warn
          retention-days: 14
