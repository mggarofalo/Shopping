name: Swift exhaustive tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: full
        type: choice
        options:
          - full
          - performance

permissions:
  contents: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'full' }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Verify local ShoppingFull pass
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify exact-commit attestation
        if: inputs.suite == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          attestation_state="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" \
            --jq '[.statuses[] | select(.context == "local/ShoppingFull")][0].state // "missing"')"
          .github/scripts/verify-shopping-full-attestation.sh \
            "$GITHUB_SHA" \
            "$attestation_state"

  exhaustive:
    name: Full UI or performance suite
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TEST_PLAN: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'performance' && 'ShoppingPerformance' || 'ShoppingFull' }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        timeout-minutes: 2

      - name: Select Xcode version
        timeout-minutes: 1
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Capture timing metadata
        timeout-minutes: 1
        run: .github/scripts/test-timing.py init --plan "$TEST_PLAN" --json ExhaustiveTimingMetadata.json

      - name: Start pinned iOS simulator
        id: simulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          .github/scripts/test-timing.py run --phases ExhaustivePhases.jsonl --phase simulator -- bash -euo pipefail <<'SH'
          xcrun simctl list runtimes
          shopping_simulator_id="$(xcrun simctl create \
            'Shopping exhaustive iPhone 16 Pro' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          xcrun simctl boot "$shopping_simulator_id"
          xcrun simctl bootstatus "$shopping_simulator_id" -b
          # A fresh simulator's QuickPath tutorial can interrupt the first typed test value.
          xcrun simctl spawn "$shopping_simulator_id" defaults write \
            com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          echo "udid=$shopping_simulator_id" >> "$GITHUB_OUTPUT"
          SH

      - name: Build exhaustive test products
        timeout-minutes: 10
        run: |
          .github/scripts/test-timing.py run \
            --phases ExhaustivePhases.jsonl --phase build --record-command \
            --log ExhaustiveBuild.log --seconds ExhaustiveBuildSeconds.txt -- \
          xcodebuild build-for-testing \
            -project Shopping.xcodeproj \
            -scheme Shopping \
            -testPlan "$TEST_PLAN" \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath DerivedData \
            -quiet

      - name: Run exhaustive tests
        timeout-minutes: 60
        run: |
          .github/scripts/test-timing.py run \
            --phases ExhaustivePhases.jsonl --phase test --record-command \
            --log ExhaustiveTest.log --seconds ExhaustiveTestSeconds.txt -- \
          xcodebuild test-without-building \
            -project Shopping.xcodeproj \
            -scheme Shopping \
            -testPlan "$TEST_PLAN" \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath DerivedData \
            -resultBundlePath ExhaustiveResults.xcresult

      # Preserve logs first, then the bundle, before any xcresult reader can stall.
      # always() includes cancellation and also protects later coverage/report failures.
      - name: Upload exhaustive raw logs
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: exhaustive-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ExhaustiveBuild.log
            ExhaustiveTest.log
            ExhaustivePhases.jsonl
            ExhaustiveTimingMetadata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exhaustive raw results
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: exhaustive-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ExhaustiveResults.xcresult
          compression-level: 0
          if-no-files-found: warn
          retention-days: 14

      - name: Export full-plan coverage
        timeout-minutes: 1
        if: always() && env.TEST_PLAN == 'ShoppingFull' && hashFiles('ExhaustiveResults.xcresult/**') != ''
        run: |
          set +e
          .github/scripts/test-timing.py run --phases ExhaustivePhases.jsonl --phase coverage -- \
            .github/scripts/check-coverage.sh \
            ExhaustiveResults.xcresult \
            .github/coverage-baseline.json \
            ExhaustiveCoverage.json \
            ExhaustiveCoverage.md
          exit_code="$?"
          set -e
          cat ExhaustiveCoverage.md >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"

      - name: Publish exhaustive test summary
        timeout-minutes: 1
        if: always()
        run: |
          .github/scripts/test-timing.py run --phases ExhaustivePhases.jsonl --phase summary -- \
            .github/scripts/summarize-xcresult.sh \
            "$TEST_PLAN" \
            ExhaustiveResults.xcresult \
            ExhaustiveBuild.log \
            ExhaustiveTest.log \
            ExhaustiveSummary.md \
            ExhaustiveSummary.json \
            ExhaustiveBuildSeconds.txt \
            ExhaustiveTestSeconds.txt
          cat ExhaustiveSummary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exhaustive timing report
        timeout-minutes: 1
        if: always()
        run: |
          .github/scripts/test-timing.py report \
            --plan "$TEST_PLAN" --metadata ExhaustiveTimingMetadata.json --phases ExhaustivePhases.jsonl \
            --result ExhaustiveResults.xcresult \
            --json ExhaustiveTiming.json --markdown ExhaustiveTiming.md
          cat ExhaustiveTiming.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exhaustive summary
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: exhaustive-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ExhaustiveSummary.md
            ExhaustiveSummary.json
            ExhaustiveTiming.json
            ExhaustiveTimingMetadata.json
            ExhaustiveTiming.md
            ExhaustivePhases.jsonl
            ExhaustiveCoverage.md
            ExhaustiveCoverage.json
            ExhaustiveCoverage.raw.json
          if-no-files-found: error
          retention-days: 30
