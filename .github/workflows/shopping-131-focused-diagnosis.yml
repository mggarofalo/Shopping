name: SHOPPING-131 focused UI diagnosis

on:
  pull_request:
    branches: ['milestone/**']
    paths:
      - '.github/workflows/shopping-131-focused-diagnosis.yml'
      - '.github/scripts/shopping-131-native-system-resize.py'
      - '.github/scripts/shopping-131-restore-size.py'
      - 'Shopping/App/NativeAuditControlApp.swift'
      - 'Shopping/App/NativeAuditControlView.swift'
      - 'Shopping/App/ShoppingApp.swift'
      - 'ShoppingTests/HomeDetailsUITests.swift'
      - 'ShoppingTests/HomeSharingStatusUITests.swift'
      - 'ShoppingTests/OneTimePromotionUITests.swift'
      - 'Shopping/Views/HomeDetailsView.swift'
      - 'Shopping/Views/HomeSharingStatusView.swift'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'test/shopping-131-lifecycle-validation'
    name: Three UI workflows on iOS 18.5 (diagnostic only)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Select pinned Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Capture exact-source metadata
        run: .github/scripts/test-timing.py init --plan SHOPPING-131-focused --json FocusedMetadata.json

      - name: Start pinned simulator
        id: simulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          shopping_diagnostic_simulator="$(xcrun simctl create \
            'SHOPPING-131 focused iPhone 16 Pro' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          xcrun simctl boot "$shopping_diagnostic_simulator"
          xcrun simctl bootstatus "$shopping_diagnostic_simulator" -b
          xcrun simctl spawn "$shopping_diagnostic_simulator" defaults write \
            com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          echo "udid=$shopping_diagnostic_simulator" >> "$GITHUB_OUTPUT"

      - name: Build the same three-workflow candidate
        run: |
          .github/scripts/test-timing.py run \
            --phases FocusedPhases.jsonl --phase build --record-command \
            --log FocusedBuild.log -- \
          xcodebuild build-for-testing \
            -project Shopping.xcodeproj -scheme Shopping -testPlan ShoppingFull \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath NativeResizeBuild \
            -parallel-testing-enabled NO

      - name: Run the same three workflows and the additive native system-resize probe
        run: |
          set -euo pipefail
          shopping_diagnostic_xctestrun="$(python3 - <<'PYCODE'
          from pathlib import Path
          paths = list(Path('NativeResizeBuild/Build/Products').glob('*.xctestrun'))
          assert len(paths) == 1, paths
          print(paths[0])
          PYCODE
          )"
          .github/scripts/test-timing.py run \
            --phases FocusedPhases.jsonl --phase test --record-command \
            --log FocusedTest.log -- \
          python3 .github/scripts/shopping-131-native-system-resize.py \
            --simulator '${{ steps.simulator.outputs.udid }}' \
            --xctestrun "$shopping_diagnostic_xctestrun" \
            --output NativeResizeEvidence -- \
          xcodebuild test-without-building \
            -xctestrun '{xctestrun}' \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -parallel-testing-enabled NO \
            -only-testing:ShoppingTests/HomeDetailsUITests/testRestrictedMembershipAndLongNamesRemainReadableAtAccessibilityTextSize \
            -only-testing:ShoppingTests/HomeSharingStatusUITests/testStatusCheckAndReturnKeepSavedHomeAtAccessibilityTextSize \
            -only-testing:ShoppingTests/OneTimePromotionUITests/testLinkExistingUsesSavedRulesWithoutOverwritingCatalog \
            -resultBundlePath FocusedResults.xcresult

      - name: Restore original system text size on every workflow outcome
        if: always()
        run: python3 .github/scripts/shopping-131-restore-size.py NativeResizeEvidence/original-setting.json

      - name: Export diagnostic evidence
        if: always()
        run: |
          .github/scripts/test-timing.py report \
            --plan SHOPPING-131-focused --metadata FocusedMetadata.json \
            --phases FocusedPhases.jsonl --result FocusedResults.xcresult \
            --json FocusedTiming.json --markdown FocusedTiming.md
          cat FocusedTiming.md >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          tests = json.loads(Path('FocusedTiming.json').read_text())['tests']
          expected = [
              'HomeDetailsUITests/testRestrictedMembershipAndLongNamesRemainReadableAtAccessibilityTextSize()',
              'HomeSharingStatusUITests/testStatusCheckAndReturnKeepSavedHomeAtAccessibilityTextSize()',
              'OneTimePromotionUITests/testLinkExistingUsesSavedRulesWithoutOverwritingCatalog()',
          ]
          actual = Counter(test['identifier'] for test in tests)
          assert actual == Counter(expected), f'Unexpected diagnostic inventory: {actual}'
          assert all(test['bundle'] == 'ShoppingTests' for test in tests)
          assert all(test['result'] in ('Passed', 'Failed') for test in tests), 'Skipped or incomplete diagnostic test'
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shopping-131-focused-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            FocusedBuild.log
            NativeResizeEvidence/
            FocusedMetadata.json
            FocusedPhases.jsonl
            FocusedTest.log
            FocusedTiming.json
            FocusedTiming.md
            FocusedResults.xcresult
