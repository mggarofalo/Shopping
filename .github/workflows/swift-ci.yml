name: Swift CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "milestone/**"
  pull_request:
    branches:
      - main
      - "milestone/**"

jobs:
  build:
    name: Build & Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build and test
        run: |
          xcodebuild test \
            -project Shopping.xcodeproj \
            -scheme Shopping \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16 Pro' \
            -resultBundlePath TestResults.xcresult

      - name: Upload test failure results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Shopping-test-results
          path: TestResults.xcresult
          if-no-files-found: error
