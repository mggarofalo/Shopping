name: Swift CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build
        run: xcodebuild build -scheme Shopping -destination 'platform=iOS Simulator,name=iPhone 16 Pro' -quiet

      - name: Test
        run: xcodebuild test -scheme Shopping -destination 'platform=iOS Simulator,name=iPhone 16 Pro' -quiet
