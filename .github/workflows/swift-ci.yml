name: Swift CI
run-name: ${{ inputs.compatibility_canary && 'Shopping compatibility canary' || inputs.siri_launch_diagnostic && 'Shopping Siri diagnostic' || 'Shopping routine CI' }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact candidate validated by the supported dispatcher
        type: string
        default: ''
      compatibility_canary:
        description: Run only the four pinned-runtime compatibility workflows (diagnostic)
        type: boolean
        default: false
      siri_launch_diagnostic:
        description: Observe the existing Siri launch boundary without producing required-check proof
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "milestone/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cheap-contracts:
    name: Deterministic validation prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify dispatched candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 .github/scripts/staged_validation.py expected-sha "$GITHUB_SHA" "$EXPECTED_SHA"
      - name: Validate fixture inventory, driver and workflow policy
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/staged_validation.py gate

  release-build:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.siri_launch_diagnostic && !inputs.compatibility_canary) }}
    needs: cheap-contracts
    name: Release SDK Build (native)
    runs-on: xcode-27
    # Includes archive, a cold simulator boot and the separately compiled Siri suite.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select upload Xcode version
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Validate Siri runner contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p test_siri_schema_ci.py

      - name: Compile unsigned release archive
        run: >-
          xcodebuild archive
          -project Shopping.xcodeproj
          -scheme Shopping
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Shopping.xcarchive"
          -derivedDataPath "$RUNNER_TEMP/ReleaseDerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Verify exported Siri schema
        run: python3 .github/scripts/validate-siri-metadata.py "$RUNNER_TEMP/Shopping.xcarchive/Products/Applications/Shopping.app"

      - name: Test current Siri schema contracts
        run: python3 .github/scripts/siri-schema-ci.py test --output "$RUNNER_TEMP" --sample-launch

      - name: Capture Siri registration diagnostics
        if: always()
        timeout-minutes: 3
        run: python3 .github/scripts/siri-schema-ci.py capture --output "$RUNNER_TEMP"

      - name: Retain Siri schema test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: siri-schema-results
          path: |
            ${{ runner.temp }}/SiriSchema.xcresult
            ${{ runner.temp }}/SiriSchemaTests.json
            ${{ runner.temp }}/SiriSchema.log
            ${{ runner.temp }}/SiriRegistration

  siri-launch-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.siri_launch_diagnostic }}
    needs: cheap-contracts
    name: Siri launch diagnostic
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate diagnostic contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p test_siri_schema_ci.py

      - name: Select upload Xcode version
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Compile unsigned release archive
        run: >-
          xcodebuild archive
          -project Shopping.xcodeproj
          -scheme Shopping
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Shopping.xcarchive"
          -derivedDataPath "$RUNNER_TEMP/ReleaseDerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Verify exported Siri schema
        run: python3 .github/scripts/validate-siri-metadata.py "$RUNNER_TEMP/Shopping.xcarchive/Products/Applications/Shopping.app"

      - name: Observe current Siri launch boundary
        run: python3 .github/scripts/siri-schema-ci.py test --output "$RUNNER_TEMP" --sample-launch

      - name: Capture final Siri state without rebooting
        if: always()
        timeout-minutes: 3
        run: python3 .github/scripts/siri-schema-ci.py capture --output "$RUNNER_TEMP"

      - name: Retain Siri diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: siri-launch-diagnostic
          path: |
            ${{ runner.temp }}/SiriSchema.xcresult
            ${{ runner.temp }}/SiriSchemaTests.json
            ${{ runner.temp }}/SiriSchema.log
            ${{ runner.temp }}/SiriRegistration

  build:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.siri_launch_diagnostic && !inputs.compatibility_canary) }}
    needs: cheap-contracts
    name: Build & Test (native)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate CI policy
        run: |
          ruby .github/scripts/check-action-pins.rb
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p test_main_ruleset.py

      - name: Validate timing reports
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p 'test_test_timing.py'

      - name: Validate acceptance boundaries
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p 'test_acceptance_contract.py'

      - name: Validate exhaustive-run gate
        run: |
          .github/scripts/test-shopping-full-gate.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p test_full_preflight.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p test_exhaustive_contract.py

      - name: Validate compatibility canary contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p test_compatibility_canary.py

      - name: Validate system text-size driver
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p 'test_system_text_size*.py'

      - name: Validate TestFlight workflow
        run: .github/scripts/test-testflight-workflow.sh

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Verify portable test boundaries
        run: |
          if grep -ER --include='*.swift' \
            '^[[:space:]]*#[[:space:]]*(if|elseif).*targetEnvironment[[:space:]]*\([[:space:]]*simulator[[:space:]]*\)' \
            ShoppingTests; then
            echo 'Tests must use fixture or runtime capability boundaries, not simulator compilation checks.' >&2
            exit 1
          fi

      - name: Capture timing metadata
        run: |
          .github/scripts/test-timing.py init --plan "ShoppingFast" --json "$RUNNER_TEMP/FastTimingMetadata.json"
          .github/scripts/test-timing.py init --plan "ShoppingAcceptance (UI selection)" --json "$RUNNER_TEMP/AcceptanceTimingMetadata.json"
          cp "$RUNNER_TEMP/FastTimingMetadata.json" FastTimingMetadata.json
          cp "$RUNNER_TEMP/AcceptanceTimingMetadata.json" AcceptanceTimingMetadata.json

      - name: Start pinned iOS simulator
        id: simulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          .github/scripts/test-timing.py run --phases FastPhases.jsonl --phase simulator -- bash -euo pipefail <<'SH'
          xcrun simctl list runtimes
          shopping_simulator_id="$(xcrun simctl create \
            'Shopping CI iPhone 16 Pro' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          xcrun simctl boot "$shopping_simulator_id"
          xcrun simctl bootstatus "$shopping_simulator_id" -b
          # A fresh simulator's QuickPath tutorial can interrupt the first typed test value.
          xcrun simctl spawn "$shopping_simulator_id" defaults write \
            com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          echo "udid=$shopping_simulator_id" >> "$GITHUB_OUTPUT"
          SH

      - name: Build acceptance test products
        run: |
          .github/scripts/test-timing.py run \
            --phases FastPhases.jsonl --phase build --record-command \
            --log FastBuild.log --seconds FastBuildSeconds.txt -- \
          xcodebuild build-for-testing \
            -project Shopping.xcodeproj \
            -scheme Shopping \
            -testPlan ShoppingAcceptance \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath DerivedData \
            -showBuildTimingSummary

      - name: Verify built acceptance selection
        run: python3 .github/scripts/check-acceptance-selection.py --products DerivedData/Build/Products

      - name: Run fast deterministic tests
        run: |
          .github/scripts/test-timing.py run \
            --phases FastPhases.jsonl --phase test --record-command \
            --log FastTest.log --seconds FastTestSeconds.txt -- \
          xcodebuild test-without-building \
            -project Shopping.xcodeproj \
            -scheme Shopping \
            -testPlan ShoppingFast \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath DerivedData \
            -resultBundlePath FastResults.xcresult \
            -quiet

      - name: Enforce coverage baseline
        if: always() && hashFiles('FastResults.xcresult/**') != ''
        run: |
          set +e
          .github/scripts/test-timing.py run --phases FastPhases.jsonl --phase coverage -- \
            .github/scripts/check-coverage.sh \
            FastResults.xcresult \
            .github/coverage-baseline.json \
            FastCoverage.json \
            FastCoverage.md
          exit_code="$?"
          set -e
          cat FastCoverage.md >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"

      - name: Run acceptance UI workflows
        run: |
          .github/scripts/test-timing.py run \
            --phases AcceptancePhases.jsonl --phase test --record-command \
            --log AcceptanceTest.log --seconds AcceptanceTestSeconds.txt -- \
          .github/scripts/with-system-text-size.py -- xcodebuild test-without-building \
            -project Shopping.xcodeproj \
            -scheme Shopping \
            -testPlan ShoppingAcceptance \
            -only-testing:ShoppingTests \
            -parallel-testing-enabled NO \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath DerivedData \
            -resultBundlePath AcceptanceResults.xcresult \
            -collect-test-diagnostics never

      # Retain raw evidence before a reader can stall on an incomplete result.
      # Explicit status conditions also run when the native job is cancelled.
      - name: Upload raw validation logs
        if: failure() || cancelled()
        timeout-minutes: 1
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fast-failure-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            FastBuild.log
            FastTest.log
            AcceptanceTest.log
            FastPhases.jsonl
            AcceptancePhases.jsonl
            FastTimingMetadata.json
            AcceptanceTimingMetadata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload raw validation results
        id: raw-results
        if: failure() || cancelled()
        timeout-minutes: 2
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fast-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            FastResults.xcresult
            AcceptanceResults.xcresult
            DerivedData/Build/Products/*.xctestrun
          compression-level: 0
          if-no-files-found: warn
          retention-days: 14

      - name: Publish fast test summary
        if: always()
        run: |
          .github/scripts/test-timing.py run --phases FastPhases.jsonl --phase summary -- \
            .github/scripts/summarize-xcresult.sh \
            "Fast deterministic tests" \
            FastResults.xcresult \
            FastBuild.log \
            FastTest.log \
            FastSummary.md \
            FastSummary.json \
            FastBuildSeconds.txt \
            FastTestSeconds.txt
          cat FastSummary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish fast timing report
        if: always()
        run: |
          .github/scripts/test-timing.py report \
            --plan "ShoppingFast" --metadata FastTimingMetadata.json --phases FastPhases.jsonl \
            --result FastResults.xcresult \
            --json FastTiming.json --markdown FastTiming.md
          cat FastTiming.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish acceptance test summary
        if: always()
        run: |
          .github/scripts/test-timing.py run --phases AcceptancePhases.jsonl --phase summary -- \
            .github/scripts/summarize-xcresult.sh \
            "Acceptance UI workflows (shared build recorded with Fast)" \
            AcceptanceResults.xcresult \
            FastBuild.log \
            AcceptanceTest.log \
            AcceptanceSummary.md \
            AcceptanceSummary.json \
            FastBuildSeconds.txt \
            AcceptanceTestSeconds.txt
          cat AcceptanceSummary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish acceptance timing report
        if: always()
        run: |
          .github/scripts/test-timing.py report \
            --plan "ShoppingAcceptance (UI selection)" --metadata AcceptanceTimingMetadata.json --phases AcceptancePhases.jsonl \
            --result AcceptanceResults.xcresult \
            --json AcceptanceTiming.json --markdown AcceptanceTiming.md
          cat AcceptanceTiming.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify executed acceptance selection
        if: always() && hashFiles('AcceptanceResults.xcresult/**') != ''
        run: python3 .github/scripts/check-acceptance-selection.py --report AcceptanceTiming.json

      - name: Upload fast summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fast-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            FastBuild.log
            FastSummary.md
            FastSummary.json
            FastTiming.json
            FastTimingMetadata.json
            FastTiming.md
            FastPhases.jsonl
            FastCoverage.md
            FastCoverage.json
            FastCoverage.raw.json
            AcceptanceSummary.md
            AcceptanceSummary.json
            AcceptanceTiming.json
            AcceptanceTimingMetadata.json
            AcceptanceTiming.md
            AcceptancePhases.jsonl
          if-no-files-found: error
          retention-days: 30

      # A reporting failure after passing tests still needs its raw bundle.
      # The early upload owns interrupted tests; never upload that bundle twice.
      - name: Upload results after reporting failure
        if: (failure() || cancelled()) && steps.raw-results.outcome == 'skipped'
        timeout-minutes: 2
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fast-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            FastResults.xcresult
            AcceptanceResults.xcresult
            DerivedData/Build/Products/*.xctestrun
            FastBuild.log
            FastTest.log
            AcceptanceTest.log
          compression-level: 0
          if-no-files-found: warn
          retention-days: 14

  compatibility-canary:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compatibility_canary }}
    needs: cheap-contracts
    name: Compatibility Canary (diagnostic)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select pinned compatibility Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Validate canary tooling before simulator allocation
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p test_compatibility_canary.py
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/check-driver-contracts.py
      - name: Run serial compatibility canary
        timeout-minutes: 25
        run: |
          simulator_id="$(xcrun simctl create 'Shopping compatibility' com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          python3 .github/scripts/run-compatibility-canary.py --simulator "$simulator_id" --artifacts "$RUNNER_TEMP/Compatibility"
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Compatibility/*.json
            ${{ runner.temp }}/Compatibility/*.jsonl
            ${{ runner.temp }}/Compatibility/*.md
            ${{ runner.temp }}/Compatibility/*.txt
            ${{ runner.temp }}/Compatibility/*.xctestrun
            ${{ runner.temp }}/Compatibility/*.log
            ${{ runner.temp }}/Compatibility/Results.xcresult
          retention-days: 14
          compression-level: 0

  build-required:
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.siri_launch_diagnostic || inputs.compatibility_canary) && 'Build gate not requested' || 'Build & Test' }}
    needs: [cheap-contracts, build]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (!inputs.siri_launch_diagnostic && !inputs.compatibility_canary)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require successful prerequisites and native validation
        if: ${{ always() }}
        env:
          CHEAP_RESULT: ${{ needs.cheap-contracts.result }}
          NATIVE_RESULT: ${{ needs.build.result }}
        run: test "$CHEAP_RESULT" = success && test "$NATIVE_RESULT" = success
      - name: Reject cancelled workflow
        if: ${{ cancelled() }}
        run: exit 1

  release-required:
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.siri_launch_diagnostic || inputs.compatibility_canary) && 'Release gate not requested' || 'Release SDK Build' }}
    needs: [cheap-contracts, release-build]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (!inputs.siri_launch_diagnostic && !inputs.compatibility_canary)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require successful prerequisites and native validation
        if: ${{ always() }}
        env:
          CHEAP_RESULT: ${{ needs.cheap-contracts.result }}
          NATIVE_RESULT: ${{ needs.release-build.result }}
        run: test "$CHEAP_RESULT" = success && test "$NATIVE_RESULT" = success
      - name: Reject cancelled workflow
        if: ${{ cancelled() }}
        run: exit 1
